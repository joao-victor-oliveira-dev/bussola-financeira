# Dependências: requirements.txt (produção) e requirements-dev.txt (desenvolvimento).

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
addopts = "-q"
# STATIC_ROOT só existe após o collectstatic (deploy); nos testes o aviso do WhiteNoise é ruído.
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
