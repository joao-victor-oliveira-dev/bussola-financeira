[project]
name = "bussola-backend"
version = "0.1.0"
description = "API do Bússola Financeira (Django + Django Ninja)"
requires-python = ">=3.13"
dependencies = [
    "django~=5.2",
    "django-environ>=0.14.0",
    "django-ninja>=1.8.0",
    "email-validator>=2.3.0",
    "gunicorn>=27.0.1",
    "psycopg[binary]>=3.3.9",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
