name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bussola
          POSTGRES_USER: bussola
          POSTGRES_PASSWORD: bussola
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bussola" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://bussola:bussola@localhost:5432/bussola
      SECRET_KEY: ci-only
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  openapi-sync:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: python manage.py export_openapi
        working-directory: backend
      - run: npm ci && npm run api:gen
        working-directory: frontend
      - name: Cliente gerado está em dia com a API
        run: git diff --exit-code -- frontend/openapi.json frontend/src/api/generated

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
