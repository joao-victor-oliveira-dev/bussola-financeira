name: Tarefas diárias (produção)

# Gera recorrências e reseta a demo em produção, sem worker pago:
# chama POST /api/internal/daily com o segredo. Sem deploy configurado, não faz nada.
on:
  schedule:
    - cron: "0 6 * * *" # 03:00 em Brasília
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o endpoint interno
        env:
          API_URL: ${{ vars.PROD_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "PROD_API_URL ou CRON_SECRET não configurados: nada a fazer."
            exit 0
          fi
          # o plano gratuito do Render hiberna: a primeira chamada pode levar ~1 min para acordar
          curl -fsS --retry 3 --retry-delay 20 --max-time 150 \
            -X POST "$API_URL/api/internal/daily" -H "X-Cron-Secret: $CRON_SECRET"
