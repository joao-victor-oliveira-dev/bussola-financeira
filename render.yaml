# Blueprint do Render: API (Django) + Postgres. Front fica no Vercel (frontend/vercel.json).
# Uso: Render → New → Blueprint → aponte este repositório. Depois preencha CSRF_TRUSTED_ORIGINS
# com a URL do Vercel e copie CRON_SECRET para os secrets do GitHub (ver README, "Deploy").
databases:
  - name: bussola-db
    plan: free
    databaseName: bussola
    user: bussola

services:
  - type: web
    name: bussola-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # migrate no start: o plano gratuito não tem pre-deploy command
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bussola-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        sync: false # ex.: https://bussola-financeira.vercel.app
      - key: DEMO_ENABLED
        value: "True"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: CRON_SECRET
        generateValue: true
