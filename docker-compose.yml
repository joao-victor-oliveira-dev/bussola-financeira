services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bussola
      POSTGRES_USER: bussola
      POSTGRES_PASSWORD: bussola
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bussola -d bussola"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: dev-docker-insecure
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: postgres://bussola:bussola@db:5432/bussola
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
    volumes:
      - ./backend:/app
      - /app/.venv
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
